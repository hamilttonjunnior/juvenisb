<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptidão Física - Académicos</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-zinc-900 min-h-screen font-sans">
<div class="max-w-7xl mx-auto px-4 py-6">
  <header class="mb-6 flex flex-wrap justify-between items-center border-b pb-4 gap-3">
    <h1 class="text-2xl font-bold">Aptidão Física - Académicos</h1>
    <div class="flex gap-2">
      <select id="filtroEscalao" class="border rounded-lg px-3 py-2 text-sm"><option value="todos">Todos os Escalões</option></select>
      <button onclick="abrirModal()" class="bg-zinc-100 border rounded-lg px-3 py-2 text-sm">Gerir Escalões</button>
    </div>
  </header>

  <section class="bg-zinc-50 border rounded-2xl p-5 mb-6">
    <h2 class="font-semibold mb-4">Registar Avaliação</h2>
    <form id="formAtleta" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></form>
  </section>

  <section class="border rounded-2xl overflow-hidden">
    <div class="p-4 flex justify-between bg-zinc-50 border-b">
      <h2 class="font-semibold">Relatório</h2><span id="total" class="text-xs bg-zinc-200 px-3 py-1 rounded-full">0 registos</span>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-left text-sm">
      <thead id="thead" class="bg-zinc-100 text-xs uppercase"></thead>
      <tbody id="tbody" class="divide-y"></tbody>
    </table></div>
  </section>
</div>

<div id="modal" class="fixed inset-0 bg-zinc-900/50 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl max-w-md w-full p-6">
    <div class="flex justify-between mb-3"><h3 class="font-bold">Gerir Escalões</h3><button onclick="fecharModal()">✕</button></div>
    <div class="flex gap-2 mb-3"><input id="novoEsc" class="flex-1 border rounded-lg px-3 py-2 text-sm" placeholder="Novo escalão"><button onclick="addEsc()" class="bg-zinc-900 text-white px-4 rounded-lg text-sm">Adicionar</button></div>
    <div id="listaEsc" class="max-h-60 overflow-y-auto"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyAw6QMLT4cPJsON_XQ5hjMdItWmz6Y_DCQ", authDomain: "testeforca-7dc43.firebaseapp.com",
  projectId: "testeforca-7dc43", storageBucket: "testeforca-7dc43.appspot.com",
  messagingSenderId: "390234570412", appId: "1:390234570412:web:bc011630e2001d367e6909"
}));

/* ===== TABELAS DE REFERÊNCIA (idades 9..18+) : [Zona Saudável, Perfil Atlético] =====
   dir 'max' = maior é melhor (≥) ; 'min' = menor é melhor (≤)
   null = valor não fornecido nas imagens (preencher) */
const REF = {
 F: {
  abd:  [[9,39],[12,39],[15,46],[18,53],[18,57],[18,59],[18,62],[18,63],[18,65],[18,66]],
  flex: [[6,14],[7,15],[7,15],[7,15],[7,16],[7,16],[7,17],[7,18],[7,19],[7,19]],
  impH: [[108.4,170.9],[110.8,172.4],[113.3,173.8],[115.8,175.3],[118.1,176.4],[121.8,179.6],[123,179],[126,180.4],[129.5,183.4],[131.9,184.2]],
  impV: [[17.9,29.9],[18.3,30.4],[18.6,30.8],[19,31.3],[19,31.3],[20,32.5],[20.3,32.8],[20.9,33.6],[20.5,33],[20.5,34]],
  t4x10:[[13.2,11.73],[13.1,11.67],[13,11.61],[12.9,11.55],[12.8,11.5],[12.7,11.4],[12.7,11.4],[12.6,11.3],[12.6,11.4],[12.6,11.4]],
  v40:  [[8.55,7.51],[8.23,7.23],[7.97,7],[7.77,6.82],[7.62,6.69],[7.52,6.61],[7.49,6.58],[7.51,6.6],[7.58,6.67],[7.72,6.79]],
  v20:  [[4.55,4.02],[4.43,3.9],[4.32,3.8],[4.24,3.73],[4.19,3.68],[4.16,3.66],[4.16,3.66],[4.18,3.69],[4.23,3.75],[4.31,3.83]],
  senta:[[22.9,31.2],[22.9,31.2],[25.4,31.4],[25.4,32.1],[25.4,33.3],[25.4,34.6],[30.5,35.3],[30.5,35.6],[30.5,36],[30.5,36.3]],
  imc:  [[13.3,18.7],[13.7,19.4],[14.1,20.3],[14.7,21.3],[15.2,22.3],[15.7,23.1],[16,23.8],[16.3,24.3],[16.4,24.6],[16.5,25]]
 },
 M: {
  abd:  [[9,47],[12,47],[15,54],[18,60],[21,66],[24,71],[24,71],[24,71],[24,71],[24,71]],
  flex: [[6,17],[7,21],[8,21],[10,21],[12,22],[14,24],[16,27],[18,29],[18,32],[18,34]],
  impH: [[102.1,160],[110.1,170.2],[119,180.4],[128.4,190.6],[135.4,197.3],[151.5,213.3],[165.4,224.4],[175.9,231.8],[184.2,239],[203.2,251.7]],
  impV: Array(10).fill(null),
  t4x10:[[13.1,11.98],[12.8,11.65],[12.5,11.38],[12.2,11.11],[12,10.9],[11.7,10.6],[11.2,10.2],[10.9,9.9],[10.9,9.9],[10.4,9.49]],
  v40:  Array(10).fill(null),
  v20:  Array(10).fill(null),
  senta:[[20.3,29.3],[20.3,29.3],[20.3,28.9],[20.3,28.8],[20.3,29.2],[20.3,30.4],[20.3,31.9],[20.3,33.5],[20.3,34.5],[20.3,35]],
  imc:  [[12.6,18.2],[13.9,18.8],[13.2,19.5],[14.7,20.4],[15.2,21.3],[15.7,22.2],[16.3,23.1],[16.7,23.9],[17.1,24.6],[18.5,25]]
 }
};

const TESTES = [
 {k:'abd',  nome:'Abdominais (rep.)',        step:1,    dir:'max'},
 {k:'flex', nome:'Flexões (rep.)',           step:1,    dir:'max'},
 {k:'impH', nome:'Impulsão Horizontal (cm)', step:0.1,  dir:'max'},
 {k:'impV', nome:'Impulsão Vertical (cm)',   step:0.1,  dir:'max'},
 {k:'t4x10',nome:'Agilidade 4x10m (s)',      step:0.01, dir:'min'},
 {k:'v40',  nome:'Velocidade 40m (s)',       step:0.01, dir:'min'},
 {k:'v20',  nome:'Velocidade 20m (s)',       step:0.01, dir:'min'},
 {k:'senta',nome:'Senta e Alcança (cm, pode ser negativo)', step:0.1, dir:'max'}
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idx = idade => Math.min(Math.max(idade, 9), 18) - 9;

function avaliar(t, a) {
  const v = a[t.k];
  if (v === null || v === undefined || isNaN(v)) return '-';
  const r = REF[a.genero]?.[t.k]?.[idx(a.idade)];
  if (!r) return `${v}<br><span class="text-xs text-zinc-400">sem referência</span>`;
  const ok = (lim) => t.dir === 'max' ? v >= lim : v <= lim;
  let txt, cls;
  if (ok(r[1])) { txt = 'Perfil Atlético'; cls = 'text-emerald-700 font-bold'; }
  else if (ok(r[0])) { txt = 'Zona Saudável'; cls = 'text-sky-700 font-semibold'; }
  else { txt = 'Abaixo da zona'; cls = 'text-rose-600'; }
  return `${v}<br><span class="text-xs ${cls}">${txt}</span>`;
}

function imc(a) {
  const v = a.peso / (a.altura * a.altura);
  const r = REF[a.genero].imc[idx(a.idade)];
  const st = v < r[0] ? 'Baixo peso' : v > r[1] ? 'Excesso de peso' : 'Zona Saudável';
  const cls = st === 'Zona Saudável' ? 'text-sky-700' : 'text-rose-600';
  return `<b>${v.toFixed(1)}</b><br><span class="text-xs ${cls}">${st}</span>`;
}

/* ===== Dados ===== */
let atletas = [], escaloes = [];
const $ = id => document.getElementById(id);

async function carregarEscaloes() {
  const snap = await getDocs(collection(db, "escaloes_fitescola"));
  escaloes = snap.docs.map(d => ({id: d.id, ...d.data()}));
  if (!escaloes.length) {
    for (const nome of ["Infantis", "Iniciados", "Juvenis"]) await addDoc(collection(db, "escaloes_fitescola"), {nome});
    return carregarEscaloes();
  }
  const f = $('filtroEscalao').value, e = $('escalaoForm')?.value;
  $('filtroEscalao').innerHTML = '<option value="todos">Todos os Escalões</option>' + escaloes.map(x => `<option>${esc(x.nome)}</option>`).join('');
  $('escalaoForm').innerHTML = escaloes.map(x => `<option>${esc(x.nome)}</option>`).join('');
  if (f) $('filtroEscalao').value = f; if (e) $('escalaoForm').value = e;
  renderizar();
}
async function carregarAtletas() {
  $('tbody').innerHTML = '<tr><td colspan="12" class="p-6 text-center text-zinc-400">A carregar...</td></tr>';
  try {
    const snap = await getDocs(collection(db, "atletas_fitescola"));
    atletas = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderizar();
  } catch (e) { $('tbody').innerHTML = '<tr><td colspan="12" class="p-6 text-center text-rose-500">Erro ao ligar ao Firebase (verifica as regras).</td></tr>'; }
}

/* ===== UI ===== */
const inp = (id, label, extra = '') => `<div><label class="block text-xs font-semibold uppercase text-zinc-500 mb-1">${label}</label><input id="${id}" ${extra} class="w-full border rounded-lg px-3 py-2 text-sm bg-white"></div>`;
$('formAtleta').innerHTML =
  inp('nome','Nome','type="text" required') +
  `<div><label class="block text-xs font-semibold uppercase text-zinc-500 mb-1">Escalão</label><select id="escalaoForm" class="w-full border rounded-lg px-3 py-2 text-sm bg-white"></select></div>` +
  `<div><label class="block text-xs font-semibold uppercase text-zinc-500 mb-1">Sexo</label><select id="genero" class="w-full border rounded-lg px-3 py-2 text-sm bg-white"><option value="F">Feminino</option><option value="M">Masculino</option></select></div>` +
  inp('idade','Idade','type="number" min="9" max="30" required') +
  inp('peso','Peso (kg)','type="number" step="0.1" required') +
  inp('altura','Altura (m)','type="number" step="0.01" required') +
  TESTES.map(t => inp(t.k, t.nome, `type="number" step="${t.step}"`)).join('') +
  `<div class="col-span-2 lg:col-span-4 text-right"><button class="bg-zinc-900 text-white px-8 py-2.5 rounded-lg text-sm">Guardar na Nuvem</button></div>`;

$('thead').innerHTML = '<tr>' + ['Atleta','Escalão','IMC',...TESTES.map(t => t.nome.split(' (')[0]),'Ações'].map(h => `<th class="p-3">${h}</th>`).join('') + '</tr>';

function renderizar() {
  const f = $('filtroEscalao').value;
  const lista = atletas.filter(a => f === 'todos' || a.escalao === f);
  $('total').textContent = `${lista.length} registos`;
  if (!lista.length) { $('tbody').innerHTML = '<tr><td colspan="12" class="p-6 text-center text-zinc-400">Nenhum registo.</td></tr>'; return; }
  $('tbody').innerHTML = lista.map(a => `<tr>
    <td class="p-3 font-semibold">${esc(a.nome)}<br><span class="text-xs text-zinc-500 font-normal">${esc(a.idade)}a (${esc(a.genero)})</span></td>
    <td class="p-3">${esc(a.escalao)}</td><td class="p-3">${imc(a)}</td>
    ${TESTES.map(t => `<td class="p-3">${avaliar(t, a)}</td>`).join('')}
    <td class="p-3"><button data-del="${esc(a.id)}" class="text-xs bg-zinc-100 border px-2 py-1 rounded">Eliminar</button></td></tr>`).join('');
}

$('tbody').addEventListener('click', async e => {
  const id = e.target.dataset.del;
  if (id && confirm("Eliminar este registo?")) { await deleteDoc(doc(db, "atletas_fitescola", id)); carregarAtletas(); }
});
$('filtroEscalao').addEventListener('change', renderizar);

$('formAtleta').addEventListener('submit', async e => {
  e.preventDefault();
  const n = id => { const v = $(id).value; return v === '' ? null : parseFloat(v); };   // aceita 0 e negativos
  const a = { nome: $('nome').value.trim(), escalao: $('escalaoForm').value, genero: $('genero').value,
              idade: parseInt($('idade').value), peso: n('peso'), altura: n('altura') };
  TESTES.forEach(t => a[t.k] = n(t.k));
  try { await addDoc(collection(db, "atletas_fitescola"), a); e.target.reset(); carregarAtletas(); }
  catch (err) { alert("Erro ao guardar."); }
});

/* ===== Modal escalões ===== */
function listaEsc() {
  $('listaEsc').innerHTML = escaloes.map(x => `<div class="flex justify-between py-2 text-sm"><span>${esc(x.nome)}</span><button data-esc="${esc(x.id)}" class="text-rose-600 text-xs">Remover</button></div>`).join('');
}
$('listaEsc').addEventListener('click', async e => {
  const id = e.target.dataset.esc;
  if (id && confirm("Apagar este escalão?")) { await deleteDoc(doc(db, "escaloes_fitescola", id)); await carregarEscaloes(); listaEsc(); }
});
window.abrirModal = () => { $('modal').classList.replace('hidden','flex'); listaEsc(); };
window.fecharModal = () => $('modal').classList.replace('flex','hidden');
window.addEsc = async () => {
  const nome = $('novoEsc').value.trim();
  if (!nome || escaloes.some(x => x.nome.toLowerCase() === nome.toLowerCase())) return alert("Nome inválido ou já existente.");
  await addDoc(collection(db, "escaloes_fitescola"), {nome}); $('novoEsc').value = '';
  await carregarEscaloes(); listaEsc();
};

await carregarEscaloes();
await carregarAtletas();
</script>
</body>
</html>
